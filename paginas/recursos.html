<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parroquia San Patricio - Recursos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { arena: '#F3E5DC', verdeSanPatricio: '#16A34A', negro: '#000000' } } } }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #F3E5DC; color: #000000; font-family: sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        main { flex-grow: 1; }
        h1, h2, h3, h4, h5, h6 { color: #16A34A; font-weight: bold; }
        .btn-flotante-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .btn-flotante { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s; text-decoration: none; font-size: 24px; }
        .btn-flotante:hover { transform: scale(1.1); color: white; }
        .btn-subir { background-color: #16A34A; cursor: pointer; border: none; }
        .btn-whatsapp { background-color: #25D366; }
        .card { background: white; border-radius: 0.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 1.5rem; height: 100%; }
        .nav-link { color: white; padding: 0.5rem 1rem; border-radius: 0.25rem; }
        .nav-link:hover, .nav-link.active { background-color: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
<div id="menu-container"></div>

<main class="container mx-auto px-4 py-8 space-y-16">
    <section id="recursos">
        <h2 class="text-3xl mb-6 text-center">Recursos</h2>


        <div class="card transition-opacity duration-300">
            <h3 class="text-2xl mb-4 border-b pb-2"><i class="fas fa-external-link-alt mr-2 text-verdeSanPatricio"></i>Enlaces y Recursos Externos</h3>
            <ul class="list-none space-y-3 text-lg">
                <li class="flex items-center p-3 rounded hover:bg-green-50 transition border-l-4 border-transparent hover:border-verdeSanPatricio shadow-sm bg-white"><i class="fas fa-link text-sm text-verdeSanPatricio mr-3"></i><a href="https://rodrigoquezadab.github.io/SantoRosario/" target="_blank" class="hover:text-verdeSanPatricio hover:underline transition flex-grow">Santo Rosario</a></li>
                <li class="flex items-center p-3 rounded hover:bg-green-50 transition border-l-4 border-transparent hover:border-verdeSanPatricio shadow-sm bg-white"><i class="fas fa-link text-sm text-verdeSanPatricio mr-3"></i><a href="https://liturgiadelashoras.github.io/" target="_blank" class="hover:text-verdeSanPatricio hover:underline transition flex-grow">Liturgia de las Horas: Oración Diaria</a></li>
                <li class="flex items-center p-3 rounded hover:bg-green-50 transition border-l-4 border-transparent hover:border-verdeSanPatricio shadow-sm bg-white"><i class="fas fa-link text-sm text-verdeSanPatricio mr-3"></i><a href="https://www.mercaba.org/FERIAS/cartel_pan_palabra.htm" target="_blank" class="hover:text-verdeSanPatricio hover:underline transition flex-grow">Pan y Palabra</a></li>
                <li class="flex items-center p-3 rounded hover:bg-green-50 transition border-l-4 border-transparent hover:border-verdeSanPatricio shadow-sm bg-white"><i class="fas fa-link text-sm text-verdeSanPatricio mr-3"></i><a href="https://gcatholic.org/calendar/2026/CL-es" target="_blank" class="hover:text-verdeSanPatricio hover:underline transition flex-grow">Calendario Litúrgico 2025</a></li>
                <li class="flex items-center p-3 rounded hover:bg-green-50 transition border-l-4 border-transparent hover:border-verdeSanPatricio shadow-sm bg-white"><i class="fas fa-link text-sm text-verdeSanPatricio mr-3"></i><a href="https://www.zguerras.com/" target="_blank" class="hover:text-verdeSanPatricio hover:underline transition flex-grow">Preparación de la Palabra en el Camino Neocatecumenal</a></li>
                <li class="flex items-center p-3 rounded hover:bg-green-50 transition border-l-4 border-transparent hover:border-verdeSanPatricio shadow-sm bg-white"><i class="fas fa-link text-sm text-verdeSanPatricio mr-3"></i><a href="https://salmistascaminoneocatecumenal.blogspot.com/2016/03/las-moniciones-en-el-camino.html" target="_blank" class="hover:text-verdeSanPatricio hover:underline transition flex-grow">Las Moniciones en el Camino Neocatecumenal</a></li>
                <li class="flex items-center p-3 rounded hover:bg-green-50 transition border-l-4 border-transparent hover:border-verdeSanPatricio shadow-sm bg-white"><i class="fas fa-file-pdf text-sm text-red-500 mr-3"></i><a href="https://www.archiburgos.es/wp-content/themes/archiburgos.wp/images/causa-de-marta/estatuto_de_neocatecumanle.it.pdf" target="_blank" class="hover:text-verdeSanPatricio hover:underline transition flex-grow text-gray-800">Estatuto del Camino Neocatecumenal (PDF)</a></li>
            </ul>
        </div>
    </section>
</main>

<div id="footer-container"></div>
<script src="../components.js?v=2"></script>

</body>
</html>
