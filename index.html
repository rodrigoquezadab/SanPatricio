  <div id="footer-container"></div>
  <script src="components.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch("noticias.json?v=" + new Date().getTime())
        .then(response => response.json())
        .then(newsData => {
          const bannerContainer = document.getElementById("noticias-banner");
          let bannerHTML = "";
          let bannerNews = newsData.filter(n => n.isBanner === true);
          if (bannerNews.length === 0) bannerNews = newsData.slice(0, 3);

          bannerNews.forEach((n, index) => {
            bannerHTML += `
                        <div class="banner-slide ${index === 0 ? 'active' : ''}" onclick="window.location.href='paginas/noticia.html?id=${n.id}'">
                            <img src="${n.imageUrl}" alt="${n.title}" class="banner-image">
                            <div class="banner-overlay">
                                <h3 class="banner-title">${n.title}</h3>
                            </div>
                        </div>
                    `;
          });
          bannerContainer.innerHTML = bannerHTML;

          let currentSlide = 0;
          const slides = document.querySelectorAll('.banner-slide');
          if (slides.length > 1) {
            setInterval(() => {
              slides[currentSlide].classList.remove('active');
              currentSlide = (currentSlide + 1) % slides.length;
              slides[currentSlide].classList.add('active');
            }, 5000);
          }
        })
        .catch(error => console.error("Error cargando noticias:", error));

      // Fetch horarios
      fetch("horarios.json?v=" + new Date().getTime())
        .then(response => response.json())
        .then(data => {
            if(data.misas) document.getElementById('lista-misas').innerHTML = data.misas.map(m => `<li>${m}</li>`).join('');
            if(data.confesiones) document.getElementById('lista-confesiones').innerHTML = data.confesiones.map(c => `<li>${c}</li>`).join('');
            if(data.oficina) document.getElementById('lista-oficina').innerHTML = data.oficina.map(o => `<li>${o}</li>`).join('');
            if(data.secretaria) {
                document.getElementById('lista-secretaria').innerHTML = data.secretaria.map(s => `
                  <li class="flex items-start">
                    <i class="${s.icono} text-verdeSanPatricio mt-1 w-6 text-center"></i>
                    <a href="${s.url}" ${s.url.startsWith('http') ? 'target="_blank"' : ''} class="hover:text-verdeSanPatricio transition ml-2 break-all">${s.texto}</a>
                  </li>
                `).join('');
            }
        })
        .catch(error => console.error("Error cargando horarios:", error));
    });
  </script>
